<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e4e1db" />
    <title>BikeBlock Pattern Generator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='28' height='20' rx='3' fill='%23a8843a'/%3E%3Cpath d='M8 21L16 11M12 22L20 12M16 23L24 13' stroke='%23fff3d2' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <main class="stage" id="stage" aria-label="Plate preview">
        <canvas id="canvas"></canvas>
        <div class="status" id="status" role="status" hidden></div>
        <div class="stage-tools">
          <div class="seg" role="radiogroup" aria-label="View">
            <button data-mode="brass" aria-pressed="true">Brass</button>
            <button data-mode="bw" aria-pressed="false">Black and white</button>
            <button data-mode="cut" aria-pressed="false">Cut lines</button>
          </div>
          <label class="check"><input type="checkbox" id="frameToggle" checked /> Frame</label>
          <span class="spacer"></span>
          <button id="fitBtn" class="ghost" title="Fit the plate to the window">Fit</button>
          <button id="actualBtn" class="ghost" title="Approximate 1:1 on a typical screen">Actual size</button>
        </div>
        <div class="readouts" id="readouts" aria-live="polite"></div>
      </main>

      <aside class="panel" aria-label="Controls">
        <header class="plaque">
          <input id="nameInput" class="plaque-name" aria-label="Design name" spellcheck="false" />
          <div class="plaque-row">
            <label class="edition">No. <input id="editionInput" type="number" min="1" max="99999" aria-label="Edition number" /></label>
            <div class="seedbox">
              <label for="seedInput">Seed</label>
              <button id="seedPrev" class="icon" aria-label="Previous seed">‹</button>
              <input id="seedInput" type="number" min="0" />
              <button id="seedNext" class="icon" aria-label="Next seed">›</button>
              <button id="seedRandom" class="icon" aria-label="Random seed" title="Random seed">⚄</button>
            </div>
          </div>
          <button id="exploreBtn" class="explore">Explore nine variations</button>
        </header>

        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="pattern" aria-selected="true">Pattern</button>
          <button role="tab" data-tab="plate" aria-selected="false">Plate</button>
          <button role="tab" data-tab="fab" aria-selected="false">Fabrication</button>
          <button role="tab" data-tab="files" aria-selected="false">Files</button>
        </nav>

        <section class="tabpanel" data-panel="pattern" id="panel-pattern"></section>
        <section class="tabpanel" data-panel="plate" id="panel-plate" hidden></section>
        <section class="tabpanel" data-panel="fab" id="panel-fab" hidden></section>
        <section class="tabpanel" data-panel="files" id="panel-files" hidden></section>
      </aside>
    </div>

    <div class="explore-overlay" id="exploreOverlay" hidden>
      <div class="explore-head">
        <p>Tap a plate to use it.</p>
        <span class="spacer"></span>
        <button id="exploreMore">Nine more</button>
        <button id="exploreClose" class="ghost">Close</button>
      </div>
      <div class="explore-grid" id="exploreGrid"></div>
    </div>

    <div class="drop-hint" id="dropHint" hidden>Drop an SVG, DXF, PNG or JSON exported from this app to load its settings</div>
    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
